<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desert War — socle</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #14110c; font-family: "Courier New", ui-monospace, monospace; color: #d9cca0; }
  #stage-canvas { position: absolute; inset: 0; z-index: 0; touch-action: none; }
  #vignette { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,.55); }
  .panel { position: absolute; z-index: 10; background: rgba(26,24,18,.9);
    border: 1px solid #5a5238; border-radius: 4px; padding: 10px 12px;
    font-size: 12px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.45); letter-spacing: .3px; }
  .panel h1 { margin: 0 0 5px; font-size: 12px; color: #e8b95a; letter-spacing: 1.4px; text-transform: uppercase; }
  .sub { color: #9a9070; font-size: 11px; }
  b { color: #efe4bc; }
  #hud { top: 12px; left: 12px; width: 320px; }
  #turnbar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .badge { padding:2px 8px; border-radius:3px; font-weight:700; letter-spacing:.5px; font-size:11px; }
  .badge.axis { background:#4a4c3f; color:#e9e6d6; border:1px solid #6d7061; }
  .badge.ally { background:#7c6a3f; color:#241d10; border:1px solid #cdb488; }
  .badge.phase { background:#2c281c; color:#e8b95a; border:1px solid #5a5238; }
  #hint { margin-top:4px; min-height:30px; }
  #btnPhase { margin-top:8px; width:100%; padding:8px; cursor:pointer; font-family:inherit; font-weight:700;
    background:#3a3323; color:#e8b95a; border:1px solid #6d5f38; border-radius:4px; letter-spacing:.6px; }
  #btnPhase:hover { background:#4a4029; }
  #inspector { top: 12px; right: 12px; width: 210px; }
  #inspector .empty { color:#8a8064; font-style: italic; }
  .kv { display:flex; justify-content:space-between; gap:8px; }
  .kv span:last-child { color:#efe4bc; }
  #objbar { margin-top:6px; padding-top:6px; border-top:1px solid #48412c; }
  #log { bottom: 12px; left: 12px; width: 320px; max-height: 168px; overflow:hidden; }
  #log .line { font-size:11px; padding:1px 0; color:#c8bd97; }
  #log .line b { color:#e8b95a; }
  #legend { bottom: 12px; right: 60px; font-size:11px; }
  .swatch { display:inline-block; width:10px; height:10px; border:1px solid #2a2418; vertical-align:-1px; margin-right:5px; border-radius:2px; }
  #controls { position:absolute; z-index:10; bottom:12px; right:12px; display:flex; flex-direction:column; gap:6px; }
  #controls button { width:38px; height:38px; font-size:18px; cursor:pointer; background:rgba(26,24,18,.9);
    color:#d9cca0; border:1px solid #5a5238; border-radius:4px; font-family:inherit; }
  #controls button:hover { background:#2c281c; color:#e8b95a; }
  #controls button.small { font-size:10px; letter-spacing:.5px; }
  #banner { position:absolute; z-index:30; inset:0; display:none; align-items:center; justify-content:center; }
  #banner .box { background:rgba(20,17,12,.94); border:2px solid #e8b95a; border-radius:6px; padding:26px 34px; text-align:center; }
  #banner h2 { margin:0 0 6px; color:#e8b95a; letter-spacing:2px; }
  #banner button { margin-top:14px; padding:8px 16px; cursor:pointer; font-family:inherit; font-weight:700;
    background:#3a3323; color:#e8b95a; border:1px solid #6d5f38; border-radius:4px; }
  #err { position:absolute; inset:0; z-index:50; display:none; padding:24px; color:#e88; background:#160f0f; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div id="vignette"></div>

<div id="hud" class="panel">
  <div id="turnbar">
    <span class="sub">Tour</span><b id="turnNum">1</b>
    <span id="badgeSide" class="badge axis">AXE</span>
    <span id="badgePhase" class="badge phase">MOUVEMENT</span>
  </div>
  <div id="hint" class="sub"></div>
  <button id="btnPhase">Terminer la phase ▸</button>
</div>

<div id="inspector" class="panel">
  <h1>Poste de commandement</h1>
  <div id="inspBody"><span class="empty">Aucune sélection.</span></div>
  <div id="objbar"></div>
</div>

<div id="log" class="panel"><h1>Journal</h1><div id="logBody"></div></div>

<div id="legend" class="panel">
  <div><span class="swatch" style="background:#c9b078"></span>Désert · PM 1</div>
  <div><span class="swatch" style="background:#9c855c"></span>Rocaille · PM 2 · +déf</div>
  <div><span class="swatch" style="background:#b7975a"></span>Ville/port · objectif · +déf</div>
  <div><span class="swatch" style="background:#6f9a5c"></span>Oasis · +déf</div>
  <div style="margin-top:5px;padding-top:5px;border-top:1px solid #48412c">
    <span class="swatch" style="background:#b33a2a"></span>Pion réduit (verso, facteurs moindres)</div>
  <div><span class="swatch" style="background:#e08a2a"></span>Hors ravitaillement · déf & mvt ÷2</div>
</div>

<div id="controls">
  <button id="btnIn">+</button>
  <button id="btnOut">−</button>
  <button class="small" id="btnReset">FIT</button>
</div>

<div id="banner"><div class="box"><h2 id="bannerTitle"></h2><div id="bannerSub" class="sub"></div>
  <button id="bannerBtn">Rejouer</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.13.2/pixi.min.js"></script>
<script>
(async () => {
try {
  // ===========================================================================
  //  1. GÉOMÉTRIE & DONNÉES (agnostiques du rendu)
  // ===========================================================================
  const SIZE = 46, COLS = 34, ROWS = 22, SQRT3 = Math.sqrt(3);
  const STACK_MAX = 3;        // limite d'empilement par hex
  const MAX_TURNS = 6;        // durée de la partie (objectifs comptés à la fin)

  const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];           // voisinage axial
  const key = (q,r) => q+','+r;
  const axialToPixel = (q,r) => ({ x: SIZE*1.5*q, y: SIZE*SQRT3*(r+q/2) });
  const axialRound = (q,r) => {
    let x=q, z=r, y=-x-z, rx=Math.round(x), ry=Math.round(y), rz=Math.round(z);
    const dx=Math.abs(rx-x), dy=Math.abs(ry-y), dz=Math.abs(rz-z);
    if (dx>dy && dx>dz) rx=-ry-rz; else if (dy>dz) ry=-rx-rz; else rz=-rx-ry;
    return { q:rx, r:rz };
  };
  const pixelToAxial = (x,y) => axialRound((2/3*x)/SIZE, (-1/3*x + SQRT3/3*y)/SIZE);
  const offsetToAxial = (c,rw) => ({ q:c, r: rw-(c-(c&1))/2 });
  const hexDistance = (aq,ar,bq,br) => (Math.abs(aq-bq)+Math.abs(aq+ar-bq-br)+Math.abs(ar-br))/2;
  const hexCorners = (cx,cy) => { const p=[]; for(let i=0;i<6;i++){ const a=Math.PI/180*(60*i);
    p.push(cx+SIZE*Math.cos(a), cy+SIZE*Math.sin(a)); } return p; };

  // -- Terrain : couleur, coût de mouvement (PM), décalage défensif (colonnes CRT) --
  const TERRAIN = {
    sea:   { name:'Méditerranée', fill:0x3d6270, stroke:0x2a4650, cost:Infinity, def:0 },
    coast: { name:'Littoral',     fill:0x5c8290, stroke:0x3d6270, cost:1, def:0 },
    sand:  { name:'Désert',       fill:0xc9b078, stroke:0x8f7c4f, cost:1, def:0 },
    sand2: { name:'Désert',       fill:0xd2ba82, stroke:0x8f7c4f, cost:1, def:0 },
    rock:  { name:'Rocaille',     fill:0x9c855c, stroke:0x6f5c3c, cost:2, def:2 },
    town:  { name:'Ville/port',   fill:0xb7975a, stroke:0x7a5f2e, cost:1, def:2 },
    oasis: { name:'Oasis',        fill:0x6f9a5c, stroke:0x486a3a, cost:1, def:1 },
  };
  const rand = (a,b) => { const h=Math.sin(a*127.1+b*311.7)*43758.5453; return h-Math.floor(h); };
  const terrain = new Map(), hexes = [];
  for (let c=0;c<COLS;c++) for (let rw=0;rw<ROWS;rw++){
    const {q,r}=offsetToAxial(c,rw); let t;
    if (rw<=1) t='sea'; else if (rw===2) t='coast';
    else { const n=rand(c,rw); t = n>0.90?'rock' : n>0.86?'oasis' : (n>0.5?'sand':'sand2'); }
    terrain.set(key(q,r),t); hexes.push({q,r});
  }
  [[3,2],[10,2],[17,3],[24,2],[30,3],[14,9],[22,13]].forEach(([c,rw])=>{
    const {q,r}=offsetToAxial(c,rw); if(terrain.has(key(q,r))) terrain.set(key(q,r),'town'); });
  const OBJECTIVES = [...terrain.entries()].filter(([,t])=>t==='town').map(([k])=>k);
  const objControl = new Map();     // key -> 'axis' | 'ally' (dernier occupant)

  // -- Unités (état de jeu) : facteurs recto (pleine force) puis verso (réduit) --
  // r* = facteurs de la face réduite. Un pion encaisse un palier avant d'être éliminé.
  const raw = [
    { side:'axis', type:'armor', ech:'XX', name:'15Pz', atk:8, def:7, mov:12, ratk:5, rdef:4, rmov:10, col:9,  row:6 },
    { side:'axis', type:'armor', ech:'XX', name:'21Pz', atk:8, def:7, mov:12, ratk:5, rdef:4, rmov:10, col:9,  row:8 },
    { side:'axis', type:'mech',  ech:'XX', name:'90le', atk:6, def:6, mov:10, ratk:4, rdef:4, rmov:8,  col:11, row:7 },
    { side:'axis', type:'armor', ech:'XX', name:'Ari',  atk:6, def:5, mov:10, ratk:3, rdef:3, rmov:8,  col:8,  row:10 },
    { side:'axis', type:'moto',  ech:'XX', name:'Tri',  atk:4, def:5, mov:9,  ratk:2, rdef:3, rmov:7,  col:11, row:10 },
    { side:'axis', type:'arty',  ech:'X',  name:'AR33', atk:2, def:3, mov:6,  ratk:1, rdef:2, rmov:5,  col:7,  row:8 },
    { side:'ally', type:'armor', ech:'XX', name:'7Arm', atk:7, def:7, mov:12, ratk:4, rdef:4, rmov:10, col:22, row:6 },
    { side:'ally', type:'armor', ech:'XX', name:'1Arm', atk:6, def:6, mov:11, ratk:4, rdef:4, rmov:9,  col:22, row:8 },
    { side:'ally', type:'inf',   ech:'XX', name:'2NZ',  atk:6, def:6, mov:7,  ratk:4, rdef:4, rmov:5,  col:20, row:7 },
    { side:'ally', type:'inf',   ech:'XX', name:'4Ind', atk:5, def:6, mov:6,  ratk:3, rdef:4, rmov:5,  col:20, row:10 },
    { side:'ally', type:'inf',   ech:'XX', name:'1SA',  atk:5, def:6, mov:6,  ratk:3, rdef:4, rmov:5,  col:24, row:9 },
    { side:'ally', type:'arty',  ech:'X',  name:'RA7',  atk:2, def:3, mov:6,  ratk:1, rdef:2, rmov:5,  col:25, row:7 },
  ];
  let units = raw.map((u,i)=>{ const {q,r}=offsetToAxial(u.col,u.row);
    return { id:i, ...u, q, r, mpLeft:u.mov, hasFought:false, reduced:false, supplied:true }; });

  // Facteurs effectifs : dépendent du palier (recto/verso) ET du ravitaillement.
  // Hors ravitaillement : mouvement moitié, défense moitié (arrondi au sup.).
  const eAtk = u => u.reduced ? u.ratk : u.atk;
  const eDefBase = u => u.reduced ? u.rdef : u.def;
  const eDef = u => Math.max(1, Math.ceil(eDefBase(u) * (u.supplied ? 1 : 0.5)));
  const eMov = u => { const m = u.reduced ? u.rmov : u.mov; return u.supplied ? m : Math.max(1, Math.floor(m/2)); };

  const other = s => s==='axis' ? 'ally' : 'axis';
  const unitsAt = (q,r) => units.filter(u=>u.q===q && u.r===r);
  const enemyAt = (q,r,side) => units.some(u=>u.q===q && u.r===r && u.side!==side);
  const stackCount = (q,r,side) => units.filter(u=>u.q===q && u.r===r && u.side===side).length;

  // -- Zone de contrôle (ZOC) : les 6 hexes autour de chaque unité d'un camp --
  const zocOf = side => { const s=new Set();
    for (const u of units) if (u.side===side)
      for (const [dq,dr] of DIRS){ const k=key(u.q+dq,u.r+dr); if(terrain.has(k)) s.add(k); }
    return s; };

  // -- RAVITAILLEMENT (flood-fill depuis les sources) -------------------------
  // Sources d'un camp : ses villes/ports + son bord de carte (Axe = ouest, Allié = est).
  // Le ravitaillement se propage d'hex en hex tant qu'il ne traverse ni la mer,
  // ni un hex ennemi, ni une ZOC ennemie. Une unité posée sur un hex atteint
  // est ravitaillée. C'est l'artère côtière étirée qui décide qui craque.
  function supplySources(side){
    const src=new Set();
    for (const k of OBJECTIVES) if (objControl.get(k)===side) src.add(k);   // ports tenus
    const edgeCol = side==='axis' ? 0 : COLS-1;                              // bord ami
    for (let rw=0; rw<ROWS; rw++){ const {q,r}=offsetToAxial(edgeCol,rw);
      const k=key(q,r); if (terrain.has(k) && isFinite(TERRAIN[terrain.get(k)].cost)) src.add(k); }
    return src;
  }
  function suppliedHexes(side){
    const eZOC = zocOf(other(side));
    const seen = new Set(), queue=[];
    for (const k of supplySources(side)){
      const [q,r]=k.split(',').map(Number);
      if (enemyAt(q,r,side) || eZOC.has(k)) continue;                        // source coupée
      seen.add(k); queue.push([q,r]);
    }
    while (queue.length){ const [q,r]=queue.pop();
      for (const [dq,dr] of DIRS){ const nq=q+dq, nr=r+dr, nk=key(nq,nr);
        if (seen.has(nk) || !terrain.has(nk)) continue;
        if (!isFinite(TERRAIN[terrain.get(nk)].cost)) continue;             // pas par la mer
        if (enemyAt(nq,nr,side)) continue;                                   // pas par l'ennemi
        if (eZOC.has(nk)) continue;                                          // la ZOC coupe la route
        seen.add(nk); queue.push([nq,nr]);
      }
    }
    return seen;
  }
  // Recalcule l'état de ravitaillement de toutes les unités.
  function updateSupply(){
    const cache={};
    for (const u of units){
      const s = cache[u.side] || (cache[u.side]=suppliedHexes(u.side));
      u.supplied = s.has(key(u.q,u.r));
    }
  }

  // ===========================================================================
  //  2. RÈGLES DE MOUVEMENT (Dijkstra à points, arrêt en ZOC ennemie)
  // ===========================================================================
  function computeReachable(unit){
    const start = key(unit.q,unit.r);
    const eZOC = zocOf(other(unit.side));
    const dist = { [start]: 0 };
    const frontier = [{ q:unit.q, r:unit.r, k:start, cost:0 }];
    const reachable = new Set();
    while (frontier.length){
      frontier.sort((a,b)=>a.cost-b.cost);
      const cur = frontier.shift();
      if (cur.cost > dist[cur.k]) continue;
      // entrer dans une ZOC ennemie stoppe net : hex terminal, on n'étend pas.
      if (eZOC.has(cur.k) && cur.k !== start) { reachable.add(cur.k); continue; }
      for (const [dq,dr] of DIRS){
        const nq=cur.q+dq, nr=cur.r+dr, nk=key(nq,nr);
        if (!terrain.has(nk)) continue;
        const cost = TERRAIN[terrain.get(nk)].cost;
        if (!isFinite(cost)) continue;                      // mer infranchissable
        if (enemyAt(nq,nr,unit.side)) continue;             // pas d'entrée en hex ennemi
        if (stackCount(nq,nr,unit.side) >= STACK_MAX) continue; // empilement plein
        const nc = cur.cost + cost;
        if (nc <= unit.mpLeft && (dist[nk]===undefined || nc < dist[nk])){
          dist[nk] = nc; reachable.add(nk); frontier.push({ q:nq, r:nr, k:nk, cost:nc });
        }
      }
    }
    reachable.delete(start);
    return { reachable, dist, eZOC };
  }

  function moveUnit(unit, targetKey, dist, eZOC){
    const [q,r] = targetKey.split(',').map(Number);
    unit.q=q; unit.r=r; unit.mpLeft -= dist[targetKey];
    if (eZOC.has(targetKey)) unit.mpLeft = 0;               // s'arrête en ZOC
  }

  // ===========================================================================
  //  3. RÈGLES DE COMBAT (CRT + recul/avance)
  // ===========================================================================
  const ODDS = ['1:3','1:2','1:1','2:1','3:1','4:1','5:1','6:1'];
  const CRT = { //         dé:  1    2    3    4    5    6
    '1:3': ['AE','AE','AR','AR','EX','DR'],
    '1:2': ['AE','AR','AR','EX','DR','DR'],
    '1:1': ['AR','AR','EX','DR','DR','DE'],
    '2:1': ['AR','EX','DR','DR','DE','DE'],
    '3:1': ['EX','DR','DR','DE','DE','DE'],
    '4:1': ['DR','DR','DE','DE','DE','DE'],
    '5:1': ['DR','DE','DE','DE','DE','DE'],
    '6:1': ['DE','DE','DE','DE','DE','DE'],
  };
  const RESULT_FR = { AE:'Attaquant éliminé', AR:'Attaquant repoussé', EX:'Échange',
                      DR:'Défenseur repoussé', DE:'Défenseur éliminé' };
  function oddsIndex(atk, def){
    if (def<=0) return 7; const r=atk/def;
    return r<0.5?0 : r<1?1 : r<2?2 : r<3?3 : r<4?4 : r<5?5 : r<6?6 : 7;
  }
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

  function removeUnit(u){ units = units.filter(x=>x!==u);
    const c=counters.get(u.id); if(c){ c.destroy(); counters.delete(u.id); } }

  // Réduction par palier : un pion à pleine force passe sur sa face réduite ;
  // un pion déjà réduit est éliminé. Renvoie true si l'unité a survécu.
  function hitUnit(u){ if (u.reduced){ removeUnit(u); return false; }
    u.reduced=true; redrawCounter(u); return true; }

  // Cases de recul valides : terre, pas d'ennemi, empilement libre, hors ZOC ennemie
  function retreatOptions(unit, awayQ, awayR){
    const eZOC = zocOf(other(unit.side)); const opts=[];
    for (const [dq,dr] of DIRS){
      const nq=unit.q+dq, nr=unit.r+dr, k=key(nq,nr);
      if (!terrain.has(k) || !isFinite(TERRAIN[terrain.get(k)].cost)) continue;
      if (enemyAt(nq,nr,unit.side)) continue;
      if (stackCount(nq,nr,unit.side) >= STACK_MAX) continue;
      if (eZOC.has(k)) continue;                            // reculer en ZOC = interdit ici
      opts.push({ nq, nr, d: hexDistance(nq,nr,awayQ,awayR) });
    }
    opts.sort((a,b)=>b.d-a.d);                              // le plus loin de l'ennemi
    return opts;
  }
  function retreatOrDie(unit, awayQ, awayR){
    const o = retreatOptions(unit, awayQ, awayR);
    if (!o.length) { removeUnit(unit); return false; }
    unit.q=o[0].nq; unit.r=o[0].nr; return true;
  }

  const ARTY_RANGE = 3;
  const isArmor = u => u.type==='armor';
  const isFoot  = u => u.type==='inf' || u.type==='mech' || u.type==='moto';

  function resolveCombat(attackers, defender){
    const atk = attackers.reduce((s,u)=>s+eAtk(u), 0);      // attaque effective
    const terr = TERRAIN[terrain.get(key(defender.q,defender.r))].def;    // décalage défensif (terrain)
    // Armes combinées : au moins un blindé ET une unité à pied dans la pile -> +1 colonne.
    const combined = (attackers.some(isArmor) && attackers.some(isFoot)) ? 1 : 0;
    // Appui d'artillerie : pièces amies ravitaillées, à portée du défenseur, HORS pile -> +1 chacune (max +2).
    const side = attackers[0].side, inPile = new Set(attackers.map(a=>a.id));
    let arty = 0;
    for (const u of units) if (u.side===side && u.type==='arty' && !inPile.has(u.id)
        && u.supplied && hexDistance(u.q,u.r,defender.q,defender.r) <= ARTY_RANGE) arty++;
    arty = Math.min(arty, 2);

    const idx = clamp(oddsIndex(atk, eDef(defender)) + combined + arty - terr, 0, 7);
    const col = ODDS[idx];                                  // colonne finale, tous décalages appliqués
    const die = 1 + Math.floor(Math.random()*6);
    const res = CRT[col][die-1];
    const defHex = { q:defender.q, r:defender.r };
    const atkRef = attackers[0];                            // point de fuite pour reculs

    if (res==='DE'){ hitUnit(defender); }                   // 1 palier (2e = éliminé)
    else if (res==='DR'){ retreatOrDie(defender, atkRef.q, atkRef.r); }
    else if (res==='EX'){
      hitUnit(defender);                                    // défenseur encaisse un palier
      let lost=0; const sorted=[...attackers].sort((a,b)=>eAtk(a)-eAtk(b));
      for (const a of sorted){ if (lost >= eDef(defender)) break; lost += eAtk(a); hitUnit(a); }
    }
    else if (res==='AR'){ for (const a of [...attackers]) retreatOrDie(a, defender.q, defender.r); }
    else if (res==='AE'){ for (const a of [...attackers]) hitUnit(a); }

    // Avance après combat : si l'hex du défenseur est libéré, un attaquant y entre.
    if ((res==='DE' || res==='DR') && unitsAt(defHex.q,defHex.r).length===0){
      const adv = attackers.filter(a=>units.includes(a) &&
                    hexDistance(a.q,a.r,defHex.q,defHex.r)===1)
                    .sort((a,b)=>eAtk(b)-eAtk(a))[0];
      if (adv && stackCount(defHex.q,defHex.r,adv.side) < STACK_MAX){ adv.q=defHex.q; adv.r=defHex.r; }
    }
    attackers.forEach(a=>{ if (units.includes(a)) a.hasFought=true; });
    const mods=[];
    if (combined) mods.push('combiné +1');
    if (arty)     mods.push(`artillerie +${arty}`);
    if (terr)     mods.push(`terrain −${terr}`);
    const modStr = mods.length ? ` (${mods.join(', ')})` : '';
    log(`<b>${col}</b>${modStr}, dé ${die} → ${RESULT_FR[res]}`);
    checkElimination();
  }

  // ===========================================================================
  //  4. SÉQUENCE DE JEU (IGO-UGO : Axe mvt → Axe combat → Allié mvt → Allié combat)
  // ===========================================================================
  const G = { turn:1, player:'axis', phase:'move', over:false };
  // Les PM de départ dépendent du ravitaillement : on rafraîchit le supply d'abord.
  function startMove(side){ updateSupply();
    for (const u of units) if (u.side===side){ u.mpLeft=eMov(u); u.hasFought=false; } }
  updateObjectives();
  startMove('axis');

  function endPhase(){
    if (G.over) return; clearSel();
    if (G.phase==='move'){ G.phase='combat'; }
    else {
      if (G.player==='axis'){ G.player='ally'; G.phase='move'; startMove('ally'); }
      else { G.player='axis'; G.phase='move'; G.turn++; startMove('axis'); checkTurnEnd(); }
    }
    refresh();
  }

  function updateObjectives(){ for (const k of OBJECTIVES){
    const [q,r]=k.split(',').map(Number); const occ=unitsAt(q,r)[0];
    if (occ) objControl.set(k, occ.side); } }
  const objCount = side => OBJECTIVES.filter(k=>objControl.get(k)===side).length;

  function checkElimination(){
    const a=units.some(u=>u.side==='axis'), b=units.some(u=>u.side==='ally');
    if (!a) endGame('ally','Afrikakorps anéanti'); else if (!b) endGame('axis','8th Army anéantie');
  }
  function checkTurnEnd(){ if (G.turn>MAX_TURNS){ const a=objCount('axis'), b=objCount('ally');
    endGame(a>=b?'axis':'ally', `Fin du tour ${MAX_TURNS} — objectifs ${a}–${b}`); } }

  // ===========================================================================
  //  5. RENDU (Pixi v8)
  // ===========================================================================
  const app = new PIXI.Application();
  await app.init({ width:window.innerWidth, height:window.innerHeight, background:0x14110c,
                   antialias:true, resolution:Math.min(1.5,window.devicePixelRatio||1), autoDensity:true });
  app.canvas.id='stage-canvas'; document.body.prepend(app.canvas);
  // Rendu à la demande : jeu au tour par tour, rien n'anime -> on coupe la boucle
  // 60 fps continue et on ne redessine que quand l'état OU la vue change.
  app.ticker.stop();
  const draw = () => app.render();
  window.addEventListener('resize', () => {
    app.renderer.resize(window.innerWidth, window.innerHeight);
    app.stage.hitArea = app.screen; draw();
  });

  const world=new PIXI.Container();
  const mapLayer=new PIXI.Graphics(), decoLayer=new PIXI.Graphics(),
        overlay=new PIXI.Graphics(), unitLayer=new PIXI.Container();
  world.addChild(mapLayer, decoLayer, overlay, unitLayer);
  app.stage.addChild(world);

  for (const {q,r} of hexes){ const {x,y}=axialToPixel(q,r); const t=TERRAIN[terrain.get(key(q,r))];
    mapLayer.poly(hexCorners(x,y)).fill(t.fill).stroke({width:1,color:t.stroke,alpha:.55}); }
  for (const {q,r} of hexes){ const type=terrain.get(key(q,r)); const {x,y}=axialToPixel(q,r);
    if (type==='town'){ decoLayer.rect(x-7,y-7,14,14).fill(0x3a2c17).stroke({width:1.5,color:0xe8d29a});
      decoLayer.star ? 0 : 0; }
    else if (type==='oasis'){ decoLayer.circle(x,y,7).fill(0x2f4a25).stroke({width:1.5,color:0xa8d488}); } }

  // -- Pions ------------------------------------------------------------------
  const CS=50; const counters=new Map();
  const drawSymbol=(g,type,x,y,w,h,color)=>{ const cx=x+w/2, cy=y+h/2, line={width:1.6,color};
    if (type==='inf'||type==='mech'){ g.moveTo(x,y).lineTo(x+w,y+h).moveTo(x+w,y).lineTo(x,y+h).stroke(line); }
    if (type==='armor'||type==='mech'){ g.ellipse(cx,cy,w*.33,h*.30).stroke(line); }
    if (type==='arty'){ g.circle(cx,cy,Math.min(w,h)*.17).fill(color); }
    if (type==='moto'){ g.moveTo(x,y+h).lineTo(x+w,y).stroke(line); } };
  function makeCounter(u){
    const c=new PIXI.Container();
    // Face réduite : fond un peu plus sombre pour la lisibilité "recto/verso".
    const baseFill = u.side==='axis'?0x6d7061:0xcdb488;
    const fill = u.reduced ? mixDark(baseFill) : baseFill;
    const txt = u.side==='axis'?0xf3efe2:0x2a2115;
    const shadow=new PIXI.Graphics().roundRect(-CS/2+3,-CS/2+4,CS,CS,5).fill({color:0,alpha:.35});
    const base=new PIXI.Graphics();
    base.roundRect(-CS/2,-CS/2,CS,CS,5).fill(fill).stroke({width:2,color:0x1c1810});
    base.roundRect(-CS/2+2,-CS/2+2,CS-4,CS*.26,3).fill({color:0xffffff,alpha:.10});
    const bw=CS*.64, bh=CS*.36, box=new PIXI.Graphics();
    box.rect(-bw/2,-bh/2,bw,bh).fill({color:0xf4edd8,alpha:.92}).stroke({width:1.4,color:0x1c1810});
    drawSymbol(box,u.type,-bw/2,-bh/2,bw,bh,0x241d10);
    const T=(s,sz)=>{ const t=new PIXI.Text({text:s,style:{fontFamily:'Arial',fontSize:sz,fontWeight:'700',fill:txt}}); t.anchor.set(0.5); return t; };
    const ech=T(u.ech,8); ech.position.set(0,-CS/2+7);
    const nm=T(u.name,9); nm.position.set(0,-CS/2+17);
    // Facteurs de la FACE courante (recto ou verso). Le ravitaillement, lui,
    // modifie la valeur effective au combat mais pas le nombre imprimé.
    const fa = u.reduced ? u.ratk : u.atk, fd = u.reduced ? u.rdef : u.def, fm = u.reduced ? u.rmov : u.mov;
    const fac=T(`${fa}-${fd}-${fm}`,10); fac.position.set(0,CS/2-8);
    c.addChild(shadow,base,box,ech,nm,fac);
    if (u.reduced){                                    // bande d'angle rouge = pion réduit
      const stripe=new PIXI.Graphics();
      stripe.poly([CS/2-12,-CS/2, CS/2,-CS/2, CS/2,-CS/2+12]).fill(0xb33a2a);
      c.addChild(stripe);
    }
    if (!u.supplied){                                  // liseré orange + pastille = hors ravito
      const oos=new PIXI.Graphics();
      oos.roundRect(-CS/2,-CS/2,CS,CS,5).stroke({width:2.5,color:0xe08a2a});
      oos.circle(-CS/2+7,CS/2-7,4).fill(0xe08a2a).stroke({width:1,color:0x1c1810});
      c.addChild(oos);
    }
    c.eventMode='none';
    counters.set(u.id,c); unitLayer.addChild(c); return c;
  }
  const mixDark = col => { const r=(col>>16)&255, g=(col>>8)&255, b=col&255;
    return ((r*0.62|0)<<16)|((g*0.62|0)<<8)|(b*0.62|0); };
  // Reconstruit tous les pions depuis l'état (face + ravitaillement).
  function rebuildCounters(){
    for (const c of counters.values()) c.destroy();
    counters.clear(); unitLayer.removeChildren();
    units.forEach(makeCounter);
  }
  const redrawCounter = () => rebuildCounters();
  units.forEach(makeCounter);

  function layoutStacks(){ const byHex=new Map();
    for (const u of units){ const k=key(u.q,u.r); (byHex.get(k)||byHex.set(k,[]).get(k)).push(u); }
    for (const [k,list] of byHex){ const [q,r]=k.split(',').map(Number); const {x,y}=axialToPixel(q,r);
      list.forEach((u,i)=>{ const c=counters.get(u.id); if(c) c.position.set(x+i*7, y-i*7);
        if(c) c.alpha = (G.phase==='combat' && u.side===G.player && u.hasFought) ? 0.5 : 1; }); } }

  // ===========================================================================
  //  6. SÉLECTION & INTERACTION
  // ===========================================================================
  let sel=null;              // { unit, reachable, dist, eZOC }  (phase mouvement)
  const attackers=new Set(); // ids des unités attaquantes       (phase combat)
  function clearSel(){ sel=null; attackers.clear(); }

  function drawHexOutline(k, color, width, alpha=1){ const [q,r]=k.split(',').map(Number);
    const {x,y}=axialToPixel(q,r); overlay.poly(hexCorners(x,y)).stroke({width,color,alpha}); }
  function fillHex(k, color, alpha){ const [q,r]=k.split(',').map(Number);
    const {x,y}=axialToPixel(q,r); overlay.poly(hexCorners(x,y)).fill({color,alpha}); }

  function drawOverlay(){
    overlay.clear();
    if (G.phase==='move'){
      // ZOC ennemie (pédagogique : montre où le mouvement s'arrête)
      const eZOC=zocOf(other(G.player));
      for (const k of eZOC) if (!enemyAt(...k.split(',').map(Number), G.player)) fillHex(k,0xcc4433,0.10);
      if (sel){
        for (const k of sel.reachable) fillHex(k,0xe8c85a,0.22);
        drawHexOutline(key(sel.unit.q,sel.unit.r),0xffffff,3,0.75);
      }
    } else { // combat
      // cibles valides = ennemis adjacents à une unité amie non engagée
      const targets=new Set();
      for (const u of units) if (u.side!==G.player)
        if (units.some(a=>a.side===G.player && !a.hasFought && hexDistance(a.q,a.r,u.q,u.r)===1))
          targets.add(key(u.q,u.r));
      for (const k of targets) drawHexOutline(k,0xcc4433,3,0.9);
      for (const id of attackers){ const u=units.find(x=>x.id===id); if(u) drawHexOutline(key(u.q,u.r),0x6f9a5c,3,0.95); }
    }
  }

  function handleClick(p){
    if (G.over) return;
    const {q,r}=pixelToAxial(p.x,p.y); const k=key(q,r); if(!terrain.has(k)) { clearSel(); refresh(); return; }
    if (G.phase==='move') handleMove(q,r,k); else handleCombat(q,r,k);
    refresh();
  }
  function handleMove(q,r,k){
    if (sel && sel.reachable.has(k)){ moveUnit(sel.unit,k,sel.dist,sel.eZOC);
      sel = sel.unit.mpLeft>0 ? { unit:sel.unit, ...computeReachable(sel.unit) } : null; return; }
    const own=unitsAt(q,r).filter(u=>u.side===G.player);
    sel = own.length ? { unit:own[own.length-1], ...computeReachable(own[own.length-1]) } : null;
  }
  function handleCombat(q,r,k){
    const stack=unitsAt(q,r); if (!stack.length){ attackers.clear(); return; }
    const top=stack[stack.length-1];
    if (top.side!==G.player){                              // clic ennemi -> résoudre
      let atkUnits=[...attackers].map(id=>units.find(u=>u.id===id)).filter(Boolean)
                    .filter(u=>hexDistance(u.q,u.r,q,r)===1 && !u.hasFought);
      if (!atkUnits.length)                                // sinon : tous les amis adjacents libres
        atkUnits=units.filter(u=>u.side===G.player && !u.hasFought && hexDistance(u.q,u.r,q,r)===1);
      if (!atkUnits.length){ log('Aucun attaquant adjacent.'); return; }
      resolveCombat(atkUnits, top); attackers.clear();
    } else {                                               // clic ami -> (dé)sélection attaquant
      if (top.hasFought) return;
      if (!units.some(e=>e.side!==G.player && hexDistance(e.q,e.r,q,r)===1)) return;
      attackers.has(top.id) ? attackers.delete(top.id) : attackers.add(top.id);
    }
  }

  // -- Pointeur : glisser = pan, clic bref = action, molette/boutons = zoom ----
  app.stage.eventMode='static'; app.stage.hitArea=app.screen;
  let ptr=null;
  const hoverEl=null;
  app.stage.on('pointerdown', e=>{ ptr={ sx:e.global.x, sy:e.global.y, wx:world.x, wy:world.y, moved:false }; });
  app.stage.on('pointermove', e=>{ if(!ptr) return;
    const dx=e.global.x-ptr.sx, dy=e.global.y-ptr.sy;
    if(!ptr.moved && Math.hypot(dx,dy)>6) ptr.moved=true;
    if(ptr.moved){ world.position.set(ptr.wx+dx, ptr.wy+dy); draw(); } });
  app.stage.on('pointerup', e=>{ if(ptr && !ptr.moved) handleClick(world.toLocal(e.global)); ptr=null; });
  app.stage.on('pointerupoutside', ()=>{ ptr=null; });

  const zoomAt=(m,cx,cy)=>{ const s0=world.scale.x, s1=clamp(s0*m,0.32,2.6);
    const wx=(cx-world.x)/s0, wy=(cy-world.y)/s0; world.scale.set(s1);
    world.position.set(cx-wx*s1, cy-wy*s1); draw(); };
  app.canvas.addEventListener('wheel', e=>{ e.preventDefault(); const rc=app.canvas.getBoundingClientRect();
    zoomAt(e.deltaY<0?1.12:0.89, e.clientX-rc.left, e.clientY-rc.top); }, {passive:false});
  document.getElementById('btnIn').onclick =()=>zoomAt(1.2, app.screen.width/2, app.screen.height/2);
  document.getElementById('btnOut').onclick=()=>zoomAt(0.83,app.screen.width/2, app.screen.height/2);
  function fitView(){ const b=mapLayer.getLocalBounds();
    const s=clamp(Math.min(app.screen.width/b.width, app.screen.height/b.height)*0.9,0.32,2.6);
    world.scale.set(s); world.position.set((app.screen.width-b.width*s)/2-b.x*s,
      (app.screen.height-b.height*s)/2-b.y*s); draw(); }
  document.getElementById('btnReset').onclick=fitView;
  document.getElementById('btnPhase').onclick=endPhase;

  // ===========================================================================
  //  7. HUD (DOM) & boucle de rafraîchissement
  // ===========================================================================
  const $=id=>document.getElementById(id); const logLines=[];
  function log(s){ logLines.unshift(s); if(logLines.length>8) logLines.pop();
    $('logBody').innerHTML=logLines.map(l=>`<div class="line">${l}</div>`).join(''); }

  function refresh(){
    updateObjectives(); updateSupply(); rebuildCounters(); layoutStacks(); drawOverlay();
    $('turnNum').textContent=G.turn;
    const sb=$('badgeSide'); sb.textContent=G.player==='axis'?'AXE':'ALLIÉ'; sb.className='badge '+G.player;
    $('badgePhase').textContent=G.phase==='move'?'MOUVEMENT':'COMBAT';
    const camp=G.player==='axis'?'de l\'Axe':'alliées';
    $('hint').innerHTML = G.phase==='move'
      ? `Clique une unité ${camp} pour voir ses déplacements, puis un hexagone surligné. Entrer dans une ZOC ennemie (rouge) stoppe l'unité.`
      : `Clique tes unités adjacentes à l'ennemi pour désigner les attaquants (vert), puis l'unité ennemie à assaillir (rouge). Blindé + infanterie et artillerie à portée (≤3 hex) décalent la table en ta faveur.`;
    $('btnPhase').textContent = G.phase==='move' ? 'Passer au combat ▸' :
      (G.player==='axis' ? 'Fin de tour Axe → Allié ▸' : `Fin du tour ${G.turn} ▸`);

    // inspecteur
    let html='';
    if (G.phase==='move' && sel){ const u=sel.unit;
      const sup = u.supplied ? '<span style="color:#8fbf6a">ravitaillée</span>'
                             : '<span style="color:#e08a2a">HORS ravito</span>';
      html=`<div class="kv"><span>Unité</span><span><b>${u.name}</b>${u.reduced?' <span style="color:#d16a55">(réduite)</span>':''}</span></div>`+
           `<div class="kv"><span>Att-Déf-Mvt</span><span>${eAtk(u)}-${eDef(u)}-${eMov(u)}</span></div>`+
           `<div class="kv"><span>Ravitaillement</span><span>${sup}</span></div>`+
           `<div class="kv"><span>PM restants</span><span><b>${u.mpLeft}</b></span></div>`;
    } else if (G.phase==='combat' && attackers.size){
      const as=[...attackers].map(id=>units.find(u=>u.id===id)).filter(Boolean);
      const combo = as.some(isArmor) && as.some(isFoot);
      html=`<div class="kv"><span>Attaquants</span><span>${as.map(u=>u.name).join(', ')}</span></div>`+
           `<div class="kv"><span>Force totale</span><span><b>${as.reduce((s,u)=>s+eAtk(u),0)}</b></span></div>`+
           `<div class="kv"><span>Armes combinées</span><span>${combo?'<span style="color:#8fbf6a">✓ +1 colonne</span>':'<span style="color:#8a8064">—</span>'}</span></div>`+
           `<div class="sub" style="margin-top:4px">Clique l'unité ennemie à attaquer. L'artillerie amie à portée ajoutera son appui.</div>`;
    } else html='<span class="empty">Aucune sélection.</span>';
    $('inspBody').innerHTML=html;

    $('objbar').innerHTML=`<div class="kv"><span>Objectifs</span>`+
      `<span><b>${objCount('axis')}</b> Axe · <b>${objCount('ally')}</b> Allié · ${OBJECTIVES.length} au total</span></div>`+
      `<div class="sub">Le camp contrôlant le plus d'objectifs au tour ${MAX_TURNS} l'emporte.</div>`;
    draw();
  }

  function endGame(side, reason){ G.over=true; clearSel(); drawOverlay(); draw();
    $('bannerTitle').textContent = (side==='axis'?'Victoire de l\'Axe':'Victoire alliée');
    $('bannerSub').textContent = reason; $('banner').style.display='flex'; }
  $('bannerBtn').onclick=()=>location.reload();

  updateObjectives(); fitView(); refresh();
  log('Partie prête — tour 1, phase de mouvement de l\'Axe.');

} catch (err) {
  const el=document.getElementById('err'); el.style.display='block';
  el.textContent='Erreur d\'initialisation :\n'+(err&&err.stack?err.stack:err);
}
})();
</script>
</body>
</html>
