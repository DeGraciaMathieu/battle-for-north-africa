<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle for Montélimar</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #14110c;
    font-family: "Courier New", ui-monospace, monospace; color: #d9cca0; }
  body { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  h1 { margin: 0; color: #e8b95a; letter-spacing: 2px; text-transform: uppercase; font-size: 22px; text-align: center; }
  .tag { color: #9a9070; font-size: 12px; margin: 4px 0 20px; letter-spacing: .5px; text-align: center; }
  .tag b { color: #efe4bc; }

  .armies { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 860px; }
  .army { flex: 1; min-width: 320px; background: rgba(26,24,18,.92); border: 1px solid #5a5238; border-radius: 6px; padding: 16px 18px; }
  .army.blue { border-top: 3px solid #4a6b9a; }
  .army.red  { border-top: 3px solid #a8544a; }
  .army h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: 1px; display: flex; align-items: center; }
  .rand { margin-left: auto; padding: 4px 8px; cursor: pointer; font-family: inherit; font-size: 14px;
    background: #3a3323; color: #e8b95a; border: 1px solid #6d5f38; border-radius: 4px; }
  .rand:hover { background: #4a4029; }
  .army.blue h2 { color: #8fb0d8; }
  .army.red h2 { color: #e0968f; }
  .budget { font-size: 12px; color: #9a9070; margin-bottom: 8px; }
  .budget b { color: #efe4bc; }
  .budget.over b { color: #e0603f; }
  .unit { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid #322c1e; }
  .unit .info { flex: 1; }
  .unit .nm { color: #efe4bc; font-size: 13px; }
  .unit .fx { color: #8a8064; font-size: 11px; }
  .unit .fx .cost { color: #e8b95a; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 26px; height: 26px; cursor: pointer; font-size: 15px; font-weight: 700;
    background: #3a3323; color: #e8b95a; border: 1px solid #6d5f38; border-radius: 4px; font-family: inherit; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper button:hover:not(:disabled) { background: #4a4029; }
  .stepper .n { min-width: 20px; text-align: center; color: #efe4bc; font-weight: 700; }

  /* Réglages de carte : bande compacte et discrète (secondaire) */
  .settings { margin-top: 18px; width: 100%; max-width: 860px; display: flex; flex-wrap: wrap;
    gap: 10px 18px; align-items: center; justify-content: center;
    background: rgba(26,24,18,.5); border: 1px solid #3a3628; border-radius: 6px; padding: 11px 16px; }
  .field { display: flex; gap: 8px; align-items: center; }
  label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9a9070; }
  select, input { padding: 7px 10px; font-family: inherit; font-size: 13px;
    background: #1c1a12; color: #efe4bc; border: 1px solid #6d5f38; border-radius: 4px; }
  select { min-width: 130px; }
  #seed { width: 120px; }
  select:focus, input:focus { outline: none; border-color: #e8b95a; }
  select:disabled, input:disabled { opacity: .4; }
  input::placeholder { color: #6f6750; }
  .iconbtn { width: 34px; height: 34px; padding: 0; cursor: pointer; font-family: inherit; font-size: 15px;
    background: #3a3323; color: #e8b95a; border: 1px solid #6d5f38; border-radius: 4px; }
  .iconbtn:hover:not(:disabled) { background: #4a4029; }
  .iconbtn:disabled { opacity: .4; cursor: default; }

  /* Modes de jeu : 3 cartes, l'IA en action primaire */
  .modes { margin-top: 18px; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 860px; }
  .mode { flex: 1; min-width: 170px; max-width: 250px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; font-family: inherit; padding: 15px 16px; border-radius: 8px; transition: .12s;
    background: #26241a; color: #d9cca0; border: 1px solid #5a5238; }
  .mode:hover:not(:disabled) { border-color: #e8b95a; background: #2f2c1f; transform: translateY(-1px); }
  .mode:disabled { opacity: .4; cursor: default; }
  .mode .ico { font-size: 24px; line-height: 1; }
  .mode .lbl { font-weight: 700; font-size: 15px; letter-spacing: .5px; color: #efe4bc; }
  .mode .desc { font-size: 11px; color: #9a9070; }
  .mode.primary { background: #e8b95a; border-color: #e8b95a; color: #221c10; }
  .mode.primary .lbl { color: #221c10; }
  .mode.primary .desc { color: #6a551f; }
  .mode.primary:hover:not(:disabled) { background: #f0c76a; border-color: #f0c76a; }

  /* Rejoindre : flux distinct (l'invité n'utilise pas le setup ci-dessus) */
  .join { margin-top: 16px; width: 100%; max-width: 860px; display: flex; gap: 8px; align-items: center;
    justify-content: center; border-top: 1px solid #322c1e; padding-top: 14px; }
  .join span { font-size: 12px; color: #8a8064; }
  .join input { width: 110px; text-transform: uppercase; letter-spacing: 2px; text-align: center; }
  .join button { padding: 8px 14px; cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: .5px;
    background: #3a3323; color: #e8b95a; border: 1px solid #6d5f38; border-radius: 4px; }
  .join button:hover { background: #4a4029; }

  .footer { margin-top: 18px; font-size: 11px; color: #8a8064; text-align: center; line-height: 1.6;
    display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rules { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-size: 13px; font-weight: 700;
    letter-spacing: .5px; color: #e8b95a; background: rgba(232,185,90,.08); border: 1px solid #6d5f38;
    border-radius: 20px; padding: 9px 18px; transition: .12s; }
  .rules:hover { background: rgba(232,185,90,.18); border-color: #e8b95a; }
  .rules .ico { font-size: 15px; }
</style>
</head>
<body>
  <h1>Battle for Montélimar</h1>
  <div class="tag">Composez vos armées · budget <b id="budgetTag"></b> points par camp</div>

  <div class="armies">
    <div class="army blue"><h2>🔵 Bleu <button class="rand" id="rand-blue" type="button" title="Armée aléatoire">🎲</button></h2><div class="budget" id="bud-blue"></div><div id="list-blue"></div></div>
    <div class="army red"><h2>🔴 Rouge <button class="rand" id="rand-red" type="button" title="Armée aléatoire">🎲</button></h2><div class="budget" id="bud-red"></div><div id="list-red"></div></div>
  </div>

  <div class="settings">
    <div class="field"><label for="map">Carte</label>
      <select id="map"><option value="">Aléatoire (seed)</option></select></div>
    <div class="field"><label for="biome">Biome</label>
      <select id="biome"></select></div>
    <div class="field"><label for="genMode">Génération</label>
      <select id="genMode"><option value="random">Aléatoire</option><option value="fair">Équitable</option></select></div>
    <div class="field"><label for="seed">Seed</label>
      <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="aléatoire" />
      <button class="iconbtn" id="gen" type="button" title="Seed aléatoire">🎲</button></div>
  </div>

  <div class="modes">
    <button class="mode primary" id="ai" type="button">
      <span class="ico">🤖</span><span class="lbl">Contre l'IA</span><span class="desc">Solo · tu joues Bleu</span></button>
    <button class="mode" id="play" type="button">
      <span class="ico">👥</span><span class="lbl">À deux</span><span class="desc">Même écran</span></button>
    <button class="mode" id="host" type="button">
      <span class="ico">🌐</span><span class="lbl">En ligne</span><span class="desc">Crée un code à partager</span></button>
  </div>

  <div class="join">
    <span>Invité à une partie ?</span>
    <input id="joinCode" type="text" maxlength="6" placeholder="CODE" />
    <button id="join" type="button">Rejoindre ▸</button>
  </div>

  <div class="footer">
    <a class="rules" href="regles.html"><span class="ico">📖</span> Lire les règles du jeu ▸</a>
    <span>Une même seed reproduit exactement la même carte.</span>
  </div>

  <script type="module">
    import { UNIT_CATALOG, CATALOG_ORDER, ARMY_POINTS } from './src/config.js';
    import { BIOMES } from './src/map.js';
    const $ = (id) => document.getElementById(id);
    const SIDES = ['blue', 'red'];
    const counts = {
      blue: { armor: 3, mech: 2, arty: 1, inf: 0 },
      red: { armor: 2, mech: 0, arty: 1, inf: 5 },
    };
    $('budgetTag').textContent = ARMY_POINTS;

    const spent = (side) => CATALOG_ORDER.reduce((s, t) => s + counts[side][t] * UNIT_CATALOG[t].cost, 0);
    const total = (side) => CATALOG_ORDER.reduce((s, t) => s + counts[side][t], 0);

    for (const side of SIDES) {
      const list = $(`list-${side}`);
      for (const t of CATALOG_ORDER) {
        const u = UNIT_CATALOG[t];
        const row = document.createElement('div');
        row.className = 'unit';
        row.innerHTML = `<div class="info"><div class="nm">${u.label}</div>`
          + `<div class="fx">${u.atk}-${u.def}-${u.mov} · <span class="cost">${u.cost} pts</span></div></div>`
          + `<div class="stepper"><button data-s="${side}" data-t="${t}" data-d="-1">−</button>`
          + `<span class="n" id="n-${side}-${t}"></span>`
          + `<button data-s="${side}" data-t="${t}" data-d="1">+</button></div>`;
        list.appendChild(row);
      }
    }

    function render() {
      for (const side of SIDES) {
        const sp = spent(side), over = sp > ARMY_POINTS;
        $(`bud-${side}`).className = 'budget' + (over ? ' over' : '');
        $(`bud-${side}`).innerHTML = `<b>${sp}</b> / ${ARMY_POINTS} pts · ${total(side)} unités`;
        for (const t of CATALOG_ORDER) {
          $(`n-${side}-${t}`).textContent = counts[side][t];
          document.querySelector(`button[data-s="${side}"][data-t="${t}"][data-d="1"]`).disabled = sp + UNIT_CATALOG[t].cost > ARMY_POINTS;
          document.querySelector(`button[data-s="${side}"][data-t="${t}"][data-d="-1"]`).disabled = counts[side][t] === 0;
        }
      }
      const invalid = SIDES.some((s) => total(s) === 0 || spent(s) > ARMY_POINTS);
      $('play').disabled = invalid;
      $('host').disabled = invalid;
      $('ai').disabled = invalid;
    }

    document.querySelectorAll('.stepper button').forEach((btn) => {
      btn.onclick = () => {
        const { s, t, d } = btn.dataset;
        counts[s][t] = Math.max(0, counts[s][t] + Number(d));
        render();
      };
    });

    // Compose une armée au hasard en remplissant le budget (au moins une unité).
    function randomize(side) {
      const c = Object.fromEntries(CATALOG_ORDER.map((t) => [t, 0]));
      let sp = 0, fit;
      do {
        fit = CATALOG_ORDER.filter((t) => sp + UNIT_CATALOG[t].cost <= ARMY_POINTS);
        if (fit.length) {
          const t = fit[Math.floor(Math.random() * fit.length)];
          c[t] += 1;
          sp += UNIT_CATALOG[t].cost;
        }
      } while (fit.length);
      counts[side] = c;
      render();
    }
    for (const side of SIDES) $(`rand-${side}`).onclick = () => randomize(side);

    // Cartes du dossier maps/ (manifeste). Choisir une carte fixe désactive la seed.
    fetch('maps/index.json')
      .then((res) => (res.ok ? res.json() : []))
      .then((maps) => {
        for (const m of maps) {
          const opt = document.createElement('option');
          opt.value = m.file;
          opt.textContent = m.name;
          $('map').appendChild(opt);
        }
      })
      .catch(() => {});
    // Biomes de génération procédurale (registre src/map.js) : peuplent le menu.
    for (const [id, def] of Object.entries(BIOMES)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = def.name;
      $('biome').appendChild(opt);
    }
    $('map').onchange = () => {
      const fixed = !!$('map').value;              // carte fixe → seed & génération inertes
      $('seed').disabled = fixed;
      $('gen').disabled = fixed;
      $('genMode').disabled = fixed;
      $('biome').disabled = fixed;
    };

    $('gen').onclick = () => { $('seed').value = String(Math.floor(Math.random() * 0xffffffff)); };
    // Construit la query de partie (carte + armées) commune au solo et à l'hôte.
    function buildQuery() {
      const enc = (side) => CATALOG_ORDER.map((t) => counts[side][t]).join('.');
      const q = new URLSearchParams();
      const map = $('map').value;
      const raw = $('seed').value.trim();
      if (map) q.set('map', map);
      else {
        if (/^\d+$/.test(raw)) q.set('seed', raw);
        if ($('genMode').value === 'fair') q.set('gen', 'fair');
        if ($('biome').value && $('biome').value !== 'tempere') q.set('biome', $('biome').value);
      }
      q.set('b', enc('blue'));
      q.set('r', enc('red'));
      return q;
    }
    // URL propre : évite la redirection de serve qui perd la query.
    $('play').onclick = () => { location.href = 'game?' + buildQuery().toString(); };
    $('ai').onclick = () => { const q = buildQuery(); q.set('ai', 'red'); location.href = 'game?' + q.toString(); }; // IA = Rouge, humain = Bleu
    $('host').onclick = () => { const q = buildQuery(); q.set('net', 'host'); location.href = 'game?' + q.toString(); };
    $('join').onclick = () => {
      const c = $('joinCode').value.trim().toUpperCase();
      if (c.length < 4) { $('joinCode').focus(); return; }
      location.href = 'game?net=guest&code=' + encodeURIComponent(c);
    };

    render();
  </script>
</body>
</html>
