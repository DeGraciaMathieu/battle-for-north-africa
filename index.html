<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle for North Africa</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #14110c;
    font-family: "Courier New", ui-monospace, monospace; color: #d9cca0; }
  body { display: flex; align-items: center; justify-content: center; padding: 20px;
    box-shadow: inset 0 0 220px 60px rgba(0,0,0,.6); }
  .card { width: 440px; max-width: 100%; background: rgba(26,24,18,.92);
    border: 1px solid #5a5238; border-radius: 6px; padding: 30px 34px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  h1 { margin: 0; color: #e8b95a; letter-spacing: 2px; text-transform: uppercase; font-size: 22px; }
  .tag { color: #9a9070; font-size: 12px; margin: 4px 0 22px; letter-spacing: .5px; }
  label { display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: #9a9070; margin-bottom: 6px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; font-family: inherit; font-size: 14px;
    background: #1c1a12; color: #efe4bc; border: 1px solid #6d5f38; border-radius: 4px; }
  input::placeholder { color: #6f6750; }
  input:focus { outline: none; border-color: #e8b95a; }
  button { cursor: pointer; font-family: inherit; font-weight: 700; letter-spacing: .6px;
    background: #3a3323; color: #e8b95a; border: 1px solid #6d5f38; border-radius: 4px; }
  button:hover { background: #4a4029; }
  #gen { padding: 0 14px; white-space: nowrap; font-size: 12px; }
  .hint { color: #8a8064; font-size: 11px; line-height: 1.5; margin: 10px 0 20px; }
  #play { width: 100%; padding: 12px; font-size: 15px; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Battle for North Africa</h1>
    <div class="tag">Wargame hexagonal · Bleu vs Rouge</div>

    <label for="seed">Seed de carte</label>
    <div class="row">
      <input id="seed" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="aléatoire si vide" />
      <button id="gen" type="button">🎲 Générer</button>
    </div>
    <p class="hint">Une même seed reproduit exactement la même carte (rivière, relief, villes, villages).
      Laisse le champ vide pour une carte aléatoire.</p>

    <button id="play" type="button">Jouer ▸</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    $('gen').onclick = () => { $('seed').value = String(Math.floor(Math.random() * 0xffffffff)); };
    $('play').onclick = () => {
      const raw = $('seed').value.trim();
      location.href = /^\d+$/.test(raw) ? 'game.html?seed=' + raw : 'game.html'; // vide/invalide → aléatoire
    };
    $('seed').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('play').click(); });
  </script>
</body>
</html>
